# =============================================================
# 本地开发基础设施
#   PostgreSQL 17 (pgvector) + Redis Stack + Neo4j 5
#   + Dify (LLMOps 工作流编排) + SQLBot (Text2SQL)
#
# 启动：docker compose -f docker-compose.infra.yml up -d
# 停止：docker compose -f docker-compose.infra.yml down
# 查看：docker compose -f docker-compose.infra.yml ps
#
# PostgreSQL：localhost:5432   账号 postgres / 密码 admin123
# Redis     ：localhost:6379
# Neo4j     ：localhost:7687   账号 neo4j / 密码 neo4j123
# Dify Web  ：http://localhost:3000  (通过 nginx 网关统一入口)
# Dify API  ：localhost:5001
# SQLBot    ：http://localhost:8000  (MCP: localhost:8001)
#
# 前置条件：
#   Dify 复用已有 PostgreSQL，首次启动前需创建数据库：
#   docker exec -it mwb-postgres-pgvector psql -U postgres \
#     -c "CREATE DATABASE dify;" \
#     -c "\c dify" -c "CREATE EXTENSION IF NOT EXISTS vector;" \
#     -c "CREATE DATABASE dify_plugin;" \
#     -c "CREATE DATABASE sqlbot;"
#
# 镜像可按全部指向个人阿里云仓库（见 docker/registry.env），
# 通过同名环境变量覆盖即可，例如 PGVECTOR_IMAGE、DIFY_API_IMAGE、SQLBOT_IMAGE。
# 网关镜像需先构建：docker/nginx 目录下执行 build.ps1 或 build.sh。
# =============================================================

services:
  # -----------------------------------------------------------
  # PostgreSQL 17 + pgvector 向量扩展
  # -----------------------------------------------------------
  postgres:
    # 默认用官方镜像；建议在 .env 中指向 _common/prepull.* 已中转的个人仓库地址
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg17}
    container_name: mwb-postgres-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - mwb-infra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  # Redis Stack Server 7.4.0-v8（含 Search / JSON / TimeSeries / Bloom 等模块）
  # 注意：redis-stack-server 不含 RedisInsight Web UI，仅 6379 端口
  # -----------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis/redis-stack-server:7.4.0-v8-x86_64}
    container_name: mwb-redis-stack
    environment:
      REDIS_ARGS: "--appendonly yes"
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_stack_data:/data
    networks:
      - mwb-infra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------------------------
  # Neo4j 5 知识图谱数据库
  # -----------------------------------------------------------
  neo4j:
    image: ${NEO4J_IMAGE:-library/neo4j:5.26}
    container_name: mwb-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt 协议
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mwb-infra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------
  # Dify — API 服务（后端 API + 异步任务调度）
  # 复用已有 PostgreSQL (pgvector) + Redis Stack
  # -----------------------------------------------------------
  dify-api:
    image: ${DIFY_API_IMAGE:-langgenius/dify-api:1.17.1}
    container_name: mwb-dify-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODE: api
      LOG_LEVEL: INFO
      # --- 复用已有 PostgreSQL ---
      DB_USERNAME: postgres
      DB_PASSWORD: admin123
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify
      # --- 复用已有 Redis ---
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # --- 向量数据库：pgvector ---
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: admin123
      PGVECTOR_DATABASE: dify
      # --- 文件存储（本地） ---
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # --- Sandbox ---
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
      # --- 服务地址 ---
      CONSOLE_WEB_URL: http://localhost:3000
      SERVICE_API_URL: http://localhost:3000
      # --- Plugin Daemon ---
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: dify-local-dev-secret-key-change-me
      INNER_API_KEY_FOR_PLUGIN: dify-local-dev-secret-key-change-me
      PLUGIN_REMOTE_INSTALL_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      PLUGIN_DAEMON_TIMEOUT: "600.0"
      # --- Celery Broker（使用 Redis 代替 RabbitMQ） ---
      CELERY_BROKER_URL: redis://redis:6379/1
      # --- Marketplace 国内加速（通过本地 nginx 代理缓存） ---
      MARKETPLACE_API_URL: http://dify-gateway:8888
      # --- 密钥（生产环境请替换为强随机字符串） ---
      SECRET_KEY: dify-local-dev-secret-key-change-me
    ports:
      - "5001:5001"   # 保留用于调试，正常流量走 nginx
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mwb-infra-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Worker（后台任务处理：文档解析/嵌入/异步队列）
  # -----------------------------------------------------------
  dify-worker:
    image: ${DIFY_API_IMAGE:-langgenius/dify-api:1.17.1}
    container_name: mwb-dify-worker
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      DB_USERNAME: postgres
      DB_PASSWORD: admin123
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: admin123
      PGVECTOR_DATABASE: dify
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      SECRET_KEY: dify-local-dev-secret-key-change-me
      # --- Plugin ---
      PLUGIN_DAEMON_URL: "http://plugin-daemon:5002"
      PLUGIN_DAEMON_KEY: "dify-local-dev-secret-key-change-me"
      INNER_API_KEY_FOR_PLUGIN: "dify-local-dev-secret-key-change-me"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      # --- Celery Broker ---
      CELERY_BROKER_URL: redis://redis:6379/1
      # --- Marketplace 国内加速 ---
      MARKETPLACE_API_URL: http://dify-gateway:8888
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mwb-infra-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Web 前端（Next.js）
  # -----------------------------------------------------------
  dify-web:
    image: ${DIFY_WEB_IMAGE:-langgenius/dify-web:1.17.1}
    container_name: mwb-dify-web
    environment:
      # 留空：浏览器通过 nginx 同源代理，自动检测请求地址
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      # SSR 专用：容器内直接通过 Docker 网络访问 API
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      # --- Marketplace 国内加速（iframe 也走本地代理） ---
      NEXT_PUBLIC_MARKETPLACE_URL_PREFIX: http://localhost:8888
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - dify-api
    networks:
      - mwb-infra-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Nginx 网关（统一入口，代理 web + api）
  # -----------------------------------------------------------
  dify-gateway:
    # 自建网关镜像：docker/nginx 目录下构建，或用 _common/prepull.* 已中转的地址
    image: ${GATEWAY_IMAGE:-mwb-nginx-gateway:local}
    container_name: mwb-dify-gateway
    ports:
      - "3000:80"    # Dify Web 入口
      - "8888:8888"  # Marketplace 代理入口
    environment:
      - GATEWAY_LISTEN_PORT=80
      - DIFY_API_UPSTREAM=dify-api:5001
      - DIFY_WEB_UPSTREAM=dify-web:3000
      - MARKETPLACE_LISTEN_PORT=8888
      - MARKETPLACE_RESOLVER=127.0.0.11
    volumes:
      - nginx_cache:/var/cache/nginx/marketplace
    depends_on:
      - dify-web
      - dify-api
    networks:
      - mwb-infra-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Sandbox（Python/JS 代码安全沙箱执行）
  # -----------------------------------------------------------
  dify-sandbox:
    image: ${DIFY_SANDBOX_IMAGE:-langgenius/dify-sandbox:0.2.15}
    container_name: mwb-dify-sandbox
    environment:
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    ports:
      - "8194:8194"
    networks:
      - mwb-infra-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Plugin Daemon（插件管理系统，提供 model/provider 服务）
  # -----------------------------------------------------------
  plugin-daemon:
    image: ${DIFY_PLUGIN_DAEMON_IMAGE:-langgenius/dify-plugin-daemon:0.6.10-local}
    container_name: mwb-dify-plugin-daemon
    privileged: true
    environment:
      # --- Server ---
      SERVER_PORT: "5002"
      SERVER_KEY: dify-local-dev-secret-key-change-me
      PLUGIN_WORKING_PATH: "/app/storage/cwd"
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      FORCE_VERIFYING_SIGNATURE: "false"
      PPROF_ENABLED: "false"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PLUGIN_STDIO_BUFFER_SIZE: "1024"
      PLUGIN_STDIO_MAX_BUFFER_SIZE: "5242880"
      PIP_MIRROR_URL: ""
      # --- Database ---
      DB_USERNAME: postgres
      DB_PASSWORD: admin123
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # --- Dify API ---
      DIFY_INNER_API_URL: "http://dify-api:5001"
      DIFY_INNER_API_KEY: "dify-local-dev-secret-key-change-me"
      # --- Storage ---
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      # --- Plugin Remote Install (gnet cluster, NOT HTTP) ---
      PLUGIN_REMOTE_INSTALLING_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
    volumes:
      - dify_storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5002:5002"
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mwb-infra-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # SQLBot — Text2SQL 智能问数服务
  # 复用外部 PostgreSQL，跳过内置 PG；前端 SPA 与 API 同源共用 8000
  # Web UI：http://localhost:8000    MCP：http://localhost:8001
  # -----------------------------------------------------------
  sqlbot:
    image: ${SQLBOT_IMAGE:-dataease/sqlbot:v1.10.1}
    container_name: mwb-sqlbot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- 外部 PostgreSQL 元数据库（变量名与 config.py 一致） ---
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: sqlbot
      # --- 安全密钥 ---
      SECRET_KEY: sqlbot-dev-secret-key-change-in-production-2024
      # --- 基础设置 ---
      PROJECT_NAME: SQLBot
      DEFAULT_PWD: "SQLBot@123456"
      LOG_LEVEL: INFO
      SQL_DEBUG: "false"
      # --- 缓存（复用已有 Redis） ---
      CACHE_TYPE: redis
      CACHE_REDIS_URL: "redis://redis:6379/1"
      # --- CORS ---
      BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:8000"
      # --- MCP 图片外链 ---
      SERVER_IMAGE_HOST: "http://localhost:8001/images/"
      # --- 向量/嵌入（默认关闭） ---
      EMBEDDING_ENABLED: "false"
      TABLE_EMBEDDING_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"   # API + 前端 SPA
      - "8001:8001"   # MCP 服务
    volumes:
      # 覆盖启动脚本: 跳过内置 PG，直连外部库
      - ./docker/sqlbot/patches/start-external-db.sh:/opt/sqlbot/app/start.sh:ro
      # 覆盖入口: 在 main:app 之上挂载前端 dist，使 UI 与 API 同源
      - ./docker/sqlbot/patches/serve_ui.py:/opt/sqlbot/app/serve_ui.py:ro
      # 持久化数据目录
      - sqlbot_data_excel:/opt/sqlbot/data/excel
      - sqlbot_data_file:/opt/sqlbot/data/file
      - sqlbot_images:/opt/sqlbot/images
      - sqlbot_logs:/opt/sqlbot/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - mwb-infra-network
    restart: unless-stopped

networks:
  mwb-infra-network:
    driver: bridge
    name: mwb-infra-network

volumes:
  pgvector_data:
  redis_stack_data:
  neo4j_data:
  neo4j_logs:
  nginx_cache:         # Marketplace 代理缓存
  dify_storage:        # Dify 文件存储（上传文档/头像等）
  sqlbot_data_excel:   # SQLBot Excel 上传文件
  sqlbot_data_file:    # SQLBot 通用数据文件
  sqlbot_images:       # SQLBot MCP 图片
  sqlbot_logs:         # SQLBot 日志
