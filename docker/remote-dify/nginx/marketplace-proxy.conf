# Dify Marketplace 反向代理（国内加速 + 本地缓存）
# 将 marketplace.dify.ai 的请求通过本地代理转发并缓存
# 首次请求走海外网络（较慢），后续请求直接命中缓存（毫秒级）
#
# 运行在 gateway 容器的 8888 端口
# 后端 MARKETPLACE_API_URL → http://dify-gateway:8888
# 前端 NEXT_PUBLIC_MARKETPLACE_URL_PREFIX → http://localhost:8888

proxy_cache_path /var/cache/nginx/marketplace
    levels=1:2
    keys_zone=marketplace_cache:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;

server {
    listen 8888;
    server_name _;

    # --- Marketplace API 代理（/api/v1/*） ---
    # 后端 dify-api/dify-worker 通过 MARKETPLACE_API_URL 指向此处
    location ~ ^/api/v1/ {
        proxy_pass https://marketplace.dify.ai;

        proxy_set_header Host              marketplace.dify.ai;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超长超时：国内访问海外可能很慢，但不能中断
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        proxy_ssl_server_name on;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;

        # 本地缓存：GET 请求缓存 1 小时，POST 不缓存
        proxy_cache            marketplace_cache;
        proxy_cache_methods    GET;
        proxy_cache_valid      200 1h;
        proxy_cache_valid      301 302 10m;
        proxy_cache_valid      any 1m;
        proxy_cache_key        $request_uri$is_args$args$request_method;
        add_header             X-Cache-Status $upstream_cache_status;

        proxy_next_upstream    off;
        proxy_ignore_headers   Cache-Control Expires;
    }

    # --- Marketplace 前端页面代理（iframe 用） ---
    # 前端 dify-web 通过 NEXT_PUBLIC_MARKETPLACE_URL_PREFIX 指向此处
    location / {
        proxy_pass https://marketplace.dify.ai;

        proxy_set_header Host              marketplace.dify.ai;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        proxy_ssl_server_name on;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;

        # 静态资源缓存
        proxy_cache            marketplace_cache;
        proxy_cache_methods    GET;
        proxy_cache_valid      200 1h;
        proxy_cache_valid      any 10m;
        proxy_cache_key        $request_uri$is_args$args$request_method;
        add_header             X-Cache-Status $upstream_cache_status;

        proxy_next_upstream    off;
        proxy_ignore_headers   Cache-Control Expires;
    }
}
