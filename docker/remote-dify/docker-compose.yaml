# =============================================================
# Dify 1.17.1 远程部署（集中式 PostgreSQL + Redis）
#
# 镜像全部来自个人阿里云仓库（由 ../_common/prepull.* 中转），
# 目标服务器无需访问 Docker Hub / ghcr.io。
#
# 启动前：
#   cp .env.example .env      # 填入真实地址与口令
#
# 端口：
#   8080 → 容器 80    （Web 统一入口；服务器上 80 常被占用，默认避开）
#   8888 → 容器 8888  （Marketplace 缓存代理）
#
# 安全提示：plugin-daemon 挂载了 /var/run/docker.sock 以获得拉起插件容器的能力，
#          仅在可信主机上部署。
# =============================================================

name: dify-remote

services:
  # --------------------------- API ---------------------------
  dify-api:
    image: ${REGISTRY:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic}/dify-api:1.17.1
    container_name: dify-api
    depends_on:
      - dify-sandbox
      - dify-plugin-daemon
    environment:
      MODE: api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- 集中式 PostgreSQL ---
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-dify}
      # --- 集中式 Redis ---
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_SERIALIZATION_PROTOCOL: "2"
      # --- 向量库：pgvector ---
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: ${PGVECTOR_HOST}
      PGVECTOR_PORT: ${PGVECTOR_PORT:-5432}
      PGVECTOR_USER: ${PGVECTOR_USER}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      PGVECTOR_DATABASE: ${PGVECTOR_DATABASE:-dify}
      # --- 文件存储 ---
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # --- Sandbox ---
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      # --- 服务对外地址 ---
      CONSOLE_API_URL: ${DIFY_BASE_URL}
      CONSOLE_WEB_URL: ${DIFY_BASE_URL}
      SERVICE_API_URL: ${DIFY_BASE_URL}
      # --- Plugin Daemon ---
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_SECRET_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${DIFY_SECRET_KEY}
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      PLUGIN_DAEMON_TIMEOUT: "600.0"
      # --- Celery Broker ---
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT:-6379}/${CELERY_BROKER_DB:-1}
      # --- Marketplace 加速（走本地网关缓存代理）---
      MARKETPLACE_API_URL: http://dify-gateway:8888
      # --- 密钥 ---
      SECRET_KEY: ${DIFY_SECRET_KEY}
    volumes:
      - dify_storage:/app/api/storage
    networks:
      - dify-net
    restart: unless-stopped

  # --------------------------- Worker ---------------------------
  dify-worker:
    image: ${REGISTRY:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic}/dify-api:1.17.1
    container_name: dify-worker
    depends_on:
      - dify-api
    environment:
      MODE: worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-dify}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_SERIALIZATION_PROTOCOL: "2"
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: ${PGVECTOR_HOST}
      PGVECTOR_PORT: ${PGVECTOR_PORT:-5432}
      PGVECTOR_USER: ${PGVECTOR_USER}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      PGVECTOR_DATABASE: ${PGVECTOR_DATABASE:-dify}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_SECRET_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${DIFY_SECRET_KEY}
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT:-6379}/${CELERY_BROKER_DB:-1}
      MARKETPLACE_API_URL: http://dify-gateway:8888
      SECRET_KEY: ${DIFY_SECRET_KEY}
    volumes:
      - dify_storage:/app/api/storage
    networks:
      - dify-net
    restart: unless-stopped

  # --------------------------- Web ---------------------------
  dify-web:
    image: ${REGISTRY:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic}/dify-web:1.17.1
    container_name: dify-web
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      NEXT_PUBLIC_MARKETPLACE_URL_PREFIX: ${DIFY_MARKETPLACE_URL:-http://localhost:8888}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - dify-api
    networks:
      - dify-net
    restart: unless-stopped

  # --------------------------- 网关 ---------------------------
  dify-gateway:
    image: ${GATEWAY_IMAGE:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic/mwb-nginx-gateway:1.0.0}
    container_name: dify-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
      - "${MARKETPLACE_PORT:-8888}:8888"
    environment:
      - GATEWAY_LISTEN_PORT=80
      - DIFY_API_UPSTREAM=dify-api:5001
      - DIFY_WEB_UPSTREAM=dify-web:3000
      - MARKETPLACE_LISTEN_PORT=8888
    volumes:
      - nginx_cache:/var/cache/nginx/marketplace
    depends_on:
      - dify-web
      - dify-api
    networks:
      - dify-net
    restart: unless-stopped

  # -------------------------- Sandbox --------------------------
  dify-sandbox:
    image: ${REGISTRY:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic}/dify-sandbox:0.2.15
    container_name: dify-sandbox
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    networks:
      - dify-net
    restart: unless-stopped

  # ----------------------- Plugin Daemon -----------------------
  dify-plugin-daemon:
    image: ${REGISTRY:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic}/dify-plugin-daemon:0.6.10-local
    container_name: dify-plugin-daemon
    privileged: true
    environment:
      SERVER_PORT: "5002"
      SERVER_KEY: ${DIFY_SECRET_KEY}
      PLUGIN_WORKING_PATH: /app/storage/cwd
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      FORCE_VERIFYING_SIGNATURE: "false"
      PPROF_ENABLED: "false"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PLUGIN_STDIO_BUFFER_SIZE: "1024"
      PLUGIN_STDIO_MAX_BUFFER_SIZE: "5242880"
      # --- Database ---
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${PLUGIN_DB_DATABASE:-dify_plugin}
      DB_SSL_MODE: disable
      # --- Redis ---
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_SERIALIZATION_PROTOCOL: "2"
      # --- Dify API ---
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${DIFY_SECRET_KEY}
      # --- Storage ---
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    volumes:
      - dify_storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dify-net
    restart: unless-stopped

networks:
  dify-net:
    driver: bridge
    name: dify-net

volumes:
  dify_storage:
  nginx_cache:
