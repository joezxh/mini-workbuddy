# =============================================================
# Dify 1.17.1 远程部署（集中式 PostgreSQL + Redis）
#
# 启动：docker compose up -d
# 停止：docker compose down
# 查看：docker compose ps
#
# Web UI：http://<server-ip>:3000
# Marketplace 代理：<server-ip>:8888
# =============================================================

services:
  # -----------------------------------------------------------
  # Dify — API 服务
  # -----------------------------------------------------------
  dify-api:
    image: langgenius/dify-api:1.17.1
    container_name: dify-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODE: api
      LOG_LEVEL: INFO
      # --- 集中式 PostgreSQL ---
      DB_USERNAME: postgres
      DB_PASSWORD: "postgres@2026!"
      DB_HOST: "192.168.100.80"
      DB_PORT: "5432"
      DB_DATABASE: dify
      # --- 集中式 Redis ---
      REDIS_HOST: "192.168.100.159"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "tqbibydiu@2025@redis"
      REDIS_DB: "6"
      REDIS_SERIALIZATION_PROTOCOL: "2"
      # --- 向量数据库：pgvector ---
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: "192.168.100.80"
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "postgres@2026!"
      PGVECTOR_DATABASE: dify
      # --- 文件存储 ---
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # --- Sandbox ---
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
      # --- 服务地址 ---
      CONSOLE_API_URL: http://192.168.110.60
      CONSOLE_WEB_URL: http://192.168.110.60
      SERVICE_API_URL: http://192.168.110.60
      # --- Plugin Daemon ---
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: dify-remote-secret-key-2026
      INNER_API_KEY_FOR_PLUGIN: dify-remote-secret-key-2026
      PLUGIN_REMOTE_INSTALL_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      PLUGIN_DAEMON_TIMEOUT: "600.0"
      # --- Celery Broker ---
      CELERY_BROKER_URL: "redis://:tqbibydiu@2025@redis@192.168.100.159:6379/7"
      # --- Marketplace 加速 ---
      MARKETPLACE_API_URL: http://dify-gateway:8888
      # --- 密钥 ---
      SECRET_KEY: dify-remote-secret-key-2026
    volumes:
      - dify_storage:/app/api/storage
    networks:
      - dify-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Worker（后台任务处理）
  # -----------------------------------------------------------
  dify-worker:
    image: langgenius/dify-api:1.17.1
    container_name: dify-worker
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      DB_USERNAME: postgres
      DB_PASSWORD: "postgres@2026!"
      DB_HOST: "192.168.100.80"
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: "192.168.100.159"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "tqbibydiu@2025@redis"
      REDIS_DB: "6"
      REDIS_SERIALIZATION_PROTOCOL: "2"
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: "192.168.100.80"
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "postgres@2026!"
      PGVECTOR_DATABASE: dify
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # --- Sandbox ---
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
      SECRET_KEY: dify-remote-secret-key-2026
      PLUGIN_DAEMON_URL: "http://dify-plugin-daemon:5002"
      PLUGIN_DAEMON_KEY: "dify-remote-secret-key-2026"
      INNER_API_KEY_FOR_PLUGIN: "dify-remote-secret-key-2026"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      CELERY_BROKER_URL: "redis://:tqbibydiu@2025@redis@192.168.100.159:6379/7"
      MARKETPLACE_API_URL: http://dify-gateway:8888
    volumes:
      - dify_storage:/app/api/storage
    networks:
      - dify-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Web 前端（Next.js）
  # -----------------------------------------------------------
  dify-web:
    image: langgenius/dify-web:1.17.1
    container_name: dify-web
    ports:
      - "3000:3000"
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      SERVER_CONSOLE_API_URL: http://192.168.110.60
      NEXT_PUBLIC_SOCKET_URL: ws://192.168.110.60
      NEXT_PUBLIC_MARKETPLACE_URL_PREFIX: http://192.168.110.60:8888
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - dify-api
    networks:
      - dify-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Nginx 网关（API 代理 + Marketplace 缓存代理）
  # -----------------------------------------------------------
  dify-gateway:
    image: nginx:alpine
    container_name: dify-gateway
    ports:
      - "80:80"
      - "8888:8888"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/marketplace-proxy.conf:/etc/nginx/conf.d/marketplace-proxy.conf:ro
      - nginx_cache:/var/cache/nginx/marketplace
    depends_on:
      - dify-web
      - dify-api
    networks:
      - dify-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Sandbox（代码安全沙箱）
  # -----------------------------------------------------------
  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.15
    container_name: dify-sandbox
    environment:
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    networks:
      - dify-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dify — Plugin Daemon（插件管理）
  # -----------------------------------------------------------
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: dify-plugin-daemon
    privileged: true
    environment:
      SERVER_PORT: "5002"
      SERVER_KEY: dify-remote-secret-key-2026
      PLUGIN_WORKING_PATH: "/app/storage/cwd"
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      FORCE_VERIFYING_SIGNATURE: "false"
      PPROF_ENABLED: "false"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PLUGIN_STDIO_BUFFER_SIZE: "1024"
      PLUGIN_STDIO_MAX_BUFFER_SIZE: "5242880"
      # --- Database ---
      DB_USERNAME: postgres
      DB_PASSWORD: "postgres@2026!"
      DB_HOST: "192.168.100.80"
      DB_PORT: "5432"
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      # --- Redis ---
      REDIS_HOST: "192.168.100.159"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "tqbibydiu@2025@redis"
      REDIS_DB: "6"
      REDIS_SERIALIZATION_PROTOCOL: "2"
      # --- Dify API ---
      DIFY_INNER_API_URL: "http://dify-api:5001"
      DIFY_INNER_API_KEY: "dify-remote-secret-key-2026"
      # --- Storage ---
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      # --- Plugin Remote Install ---
      PLUGIN_REMOTE_INSTALLING_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
    volumes:
      - dify_storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - dify-api
    networks:
      - dify-net
    restart: unless-stopped

networks:
  dify-net:
    driver: bridge
    name: dify-net

volumes:
  dify_storage:
  nginx_cache:
