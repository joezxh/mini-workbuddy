# =============================================================
# speech-to-speech —— 内置 llama.cpp LLM 模式
#
# 两个容器共享同一张 GPU：
#   llama     纯 LLM 推理（llama.cpp server，端口 8080）
#   pipeline  VAD + STT + LLM 编排 + TTS（端口 8765）
#
# 若已部署 GPUStack 承载 LLM，改用 docker-compose.gpustack.yml（单容器更省显存）。
# =============================================================

name: speech-to-speech

services:
  llama:
    image: ${LLAMA_IMAGE:-crpi-c762f77rjuytqer9.cn-hangzhou.personal.cr.aliyuncs.com/llm-basic/base/llama-cpp:server-cuda}
    command:
      - -hf
      - ${LLM_MODEL:-ggml-org/gemma-4-E4B-it-GGUF}
      - -np
      - "2"
      - -c
      - "65536"
      - -fa
      - "on"
      - --swa-full
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "127.0.0.1:${LLM_PORT:-8080}:8080"
    volumes:
      - ./cache/:/root/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

  pipeline:
    depends_on:
      - llama
    image: ${S2S_IMAGE:-s2s-pipeline:local}
    command:
      - speech-to-speech
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --llm_backend
      - responses-api
      - --model_name
      - ${LLM_MODEL:-ggml-org/gemma-4-E4B-it-GGUF}
      - --responses_api_base_url
      - http://llama:8080/v1
      - --responses_api_api_key
      - ""
      # STT / TTS 跑在容器可见的 GPU 上；TTS 用 torch 后端（默认 ggml 会走 CPU）
      - --stt
      - ${STT_BACKEND:-parakeet-tdt}
      - --tts
      - ${TTS_BACKEND:-qwen3}
      - --qwen3_tts_backend
      - ${QWEN3_TTS_BACKEND:-torch}
      - --qwen3_tts_device
      - ${QWEN3_TTS_DEVICE:-cuda}
      - --qwen3_tts_speaker
      - ${TTS_SPEAKER:-Aiden}
      - --qwen3_tts_language
      - ${TTS_LANGUAGE:-auto}
      - --init_chat_role
      - system
      - --init_chat_prompt
      - ${INIT_CHAT_PROMPT:-You are a helpful voice assistant. Reply concisely and in the user's language.}
    ports:
      - "${PIPELINE_PORT:-8765}:8765"
    volumes:
      - ./cache/:/root/.cache/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
