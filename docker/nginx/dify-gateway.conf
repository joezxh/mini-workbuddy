# Dify 统一网关代理
# 浏览器 → nginx:3000 → dify-web (SSR/静态资源) + dify-api (API 请求)
# 解决 SSR ECONNREFUSED + CORS 问题

# WebSocket 升级检测：只有客户端真正请求 Upgrade 时才转发
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # --- API 路由 → dify-api ---
    location ~ ^/(console/api|v1|files|api)/ {
        proxy_pass http://dify-api:5001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / WebSocket 支持（条件升级）
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
    }

    # --- 所有其他请求 → dify-web (Next.js) ---
    location / {
        proxy_pass http://dify-web:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / WebSocket（条件升级）
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
