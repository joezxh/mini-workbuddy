version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: minworkbuddy-postgres-dev
    environment:
      POSTGRES_DB: minworkbuddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - minworkbuddy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: minworkbuddy-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - minworkbuddy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: minworkbuddy-backend-dev
    env_file:
      - ./backend/.env
    environment:
      # 容器内 WORKDIR=/app，显式锚定项目根，使 _BASE_DIR 正确解析为 /app
      # （否则 config.py 三级上溯会算成 /，与挂载卷 /app/data/... 对不上）
      - APP_BASE_DIR=/app
      # 技能目录对齐挂载卷 /app/data/skills（默认 _BASE_DIR/backend/data/skills 在容器内会错位）
      - SKILLS_BASE_DIR=/app/data/skills
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs_dev:/app/logs
      - backend_uploads_dev:/app/uploads
      - backend_skills_dev:/app/data/skills
      - backend_hub_cache_dev:/app/data/hub_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minworkbuddy-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: minworkbuddy-frontend-dev
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - minworkbuddy-network
    restart: unless-stopped

networks:
  minworkbuddy-network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
  backend_logs_dev:
  backend_uploads_dev:
  backend_skills_dev:
  backend_hub_cache_dev:
