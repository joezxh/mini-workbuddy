<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本体建模工作台 · MinWorkBuddy 原型</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   设计基线：frontend/src/styles/tokens.css（dark skin）
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg-base:#07111f; --bg-page:#0b1322;
  --bg-surface:rgba(9,18,32,.84); --bg-elevated:rgba(11,22,38,.92);
  --bg-hover:rgba(74,163,255,.08); --bg-active:rgba(74,163,255,.14);
  --bg-input:rgba(3,8,14,.55); --bg-subtle:rgba(255,255,255,.05);
  --fg:#ebf3ff; --fg2:#8fa8c6; --fg3:#5a7a9a; --fg-inv:#050b15;
  --border:rgba(140,192,255,.14); --border-strong:rgba(140,192,255,.26);
  --divider:rgba(140,192,255,.1);
  --accent:#4aa3ff; --accent-hover:#7fd0ff; --accent-soft:rgba(74,163,255,.12);
  --amber:#f2b66d; --amber-soft:rgba(242,182,109,.12);
  --ok:#4cc38a; --ok-soft:rgba(76,195,138,.12);
  --warn:#f2b66d; --warn-soft:rgba(242,182,109,.12);
  --err:#ff7b72; --err-soft:rgba(255,123,114,.12);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh:0 18px 44px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.04);
  --sh-sm:0 1px 3px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04);
  --t:200ms cubic-bezier(.4,0,.2,1);
  --mono:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-base); color:var(--fg);
  font-family:'IBM Plex Sans','Space Grotesk','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 18% -10%, rgba(103,182,255,.10), transparent 38%),
                   radial-gradient(circle at 88% -6%, rgba(242,182,109,.07), transparent 32%);
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,192,255,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,192,255,.32)}
::-webkit-scrollbar-track{background:transparent}
code,.mono{font-family:var(--mono)}

/* ── 顶栏 ───────────────────────────────────────────────── */
.top{
  height:58px; display:flex; align-items:center; gap:14px; padding:0 16px;
  background:linear-gradient(180deg,rgba(13,22,38,.94),rgba(11,19,32,.86));
  border-bottom:1px solid var(--border); backdrop-filter:blur(14px); position:relative; z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.brand small{color:var(--fg3);font-weight:400;font-size:11px;letter-spacing:0}
.crumb{
  display:flex;align-items:center;gap:7px;color:var(--fg2);font-size:12px;
  padding:4px 10px;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border);
  max-width:340px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.crumb b{color:var(--fg);font-weight:500}
.vtabs{display:flex;gap:2px;margin-left:6px;background:var(--bg-input);padding:3px;border-radius:999px;border:1px solid var(--border)}
.vtab{
  padding:5px 13px;border-radius:999px;border:0;background:transparent;color:var(--fg2);
  cursor:pointer;transition:all var(--t);font-size:12px;white-space:nowrap;
}
.vtab:hover{color:var(--fg)}
.vtab.on{background:var(--accent-soft);color:var(--accent-hover);box-shadow:inset 0 0 0 1px rgba(74,163,255,.3)}
.vtab .n{font-family:var(--mono);font-size:10px;color:var(--fg3);margin-left:3px}
.spacer{flex:1}
.btn{
  padding:6px 13px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
  background:var(--bg-elevated);color:var(--fg2);cursor:pointer;transition:all var(--t);font-size:12px;
}
.btn:hover{color:var(--fg);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn.pri{background:linear-gradient(135deg,#2f7fd4,#3f9bf0);border-color:transparent;color:#fff;font-weight:500}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(74,163,255,.28)}
.btn.warn{color:var(--amber);border-color:rgba(242,182,109,.35)}
.btn.sm{padding:3px 9px;font-size:11px;border-radius:8px}

/* ── 主体四列 ───────────────────────────────────────────── */
.main{display:grid;grid-template-columns:240px 1fr 312px 300px;height:calc(100vh - 58px)}
.col{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.col+.col{border-left:1px solid var(--border)}
.ph{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--divider);
  font-size:11px;letter-spacing:.8px;color:var(--fg3);font-weight:600;flex:none;
}
.ph .spacer{flex:1}
.pb{flex:1;overflow:auto;padding:10px 12px}
.sub{font-size:10.5px;letter-spacing:.7px;color:var(--fg3);font-weight:600;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sub:first-child{margin-top:2px}
.sub::after{content:'';flex:1;height:1px;background:var(--divider)}

/* ── 资产视图 ───────────────────────────────────────────── */
.search{display:flex;gap:6px;margin-bottom:9px}
.inp{
  flex:1;min-width:0;padding:6px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--fg);outline:none;transition:all var(--t);
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--fg3)}
.tree{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.tnode{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:pointer;
  color:var(--fg2);font-size:12px;transition:all var(--t);
}
.tnode:hover{background:var(--bg-hover);color:var(--fg)}
.tnode.on{background:var(--accent-soft);color:var(--accent-hover)}
.tnode .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.tnode.on .cnt{color:var(--accent)}
.tnode .ar{font-size:9px;color:var(--fg3);transition:transform var(--t)}
.tnode.open .ar{transform:rotate(90deg)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{
  padding:2px 9px;border-radius:999px;font-size:11px;cursor:pointer;transition:all var(--t);
  border:1px solid var(--border);color:var(--fg2);background:var(--bg-subtle);
}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip.on{background:var(--accent-soft);border-color:rgba(74,163,255,.4);color:var(--accent-hover)}
.chip.add{color:var(--fg3);border-style:dashed}
.acard{
  border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;margin-bottom:8px;
  background:var(--bg-surface);cursor:grab;transition:all var(--t);overflow:hidden;
}
.acard:hover{border-color:var(--border-strong);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.acard:active{cursor:grabbing}
.acard .ah{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.acard .ah b{font-size:12px;font-weight:600;font-family:var(--mono)}
.acard .ddl{
  font-family:var(--mono);font-size:9px;color:var(--fg3);background:var(--bg-input);
  border:1px solid var(--divider);border-radius:7px;padding:5px 6px;line-height:1.5;
  max-height:46px;overflow:hidden;word-break:break-all;overflow-wrap:anywhere;
}
.acard .af{display:flex;gap:5px;margin-top:7px;align-items:center}
.mini{
  padding:2px 8px;border-radius:7px;border:1px solid var(--border);background:transparent;
  color:var(--fg3);font-size:10.5px;cursor:pointer;transition:all var(--t);
}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.ok{color:var(--ok)}
.tag{
  display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:6px;
  font-size:10px;border:1px solid var(--border);color:var(--fg2);background:var(--bg-subtle);
}
.tag.b{color:var(--accent);border-color:rgba(74,163,255,.3);background:var(--accent-soft)}
.tag.g{color:var(--ok);border-color:rgba(76,195,138,.3);background:var(--ok-soft)}
.tag.a{color:var(--amber);border-color:rgba(242,182,109,.3);background:var(--amber-soft)}
.tag.r{color:var(--err);border-color:rgba(255,123,114,.3);background:var(--err-soft)}

/* ── 画布 ───────────────────────────────────────────────── */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:
  linear-gradient(rgba(140,192,255,.045) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(90deg,rgba(140,192,255,.045) 1px,transparent 1px) 0 0/26px 26px,
  radial-gradient(circle at 50% 40%, rgba(74,163,255,.05), transparent 60%);
}
.canvas-wrap.drop{box-shadow:inset 0 0 40px var(--accent-soft)}
#canvas{display:block;width:100%;height:100%;cursor:default}
.n-box{cursor:pointer}
.n-box rect{transition:all var(--t)}
.n-box:hover rect{filter:brightness(1.2)}
.n-label{font-size:11.5px;font-weight:600;pointer-events:none}
.n-sub{font-size:9px;pointer-events:none;opacity:.72}
.e-label{font-size:9.5px;fill:var(--fg3);pointer-events:none;font-family:var(--mono)}
.cbar{
  position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:4px 6px;
  backdrop-filter:blur(10px);box-shadow:var(--sh-sm);z-index:5;
}
.cbar .sep{width:1px;height:16px;background:var(--divider)}
.legend{
  position:absolute;left:12px;bottom:12px;display:flex;gap:12px;align-items:center;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:5px 12px;
  font-size:10.5px;color:var(--fg2);backdrop-filter:blur(10px);z-index:5;
}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.hint{
  position:absolute;right:12px;bottom:12px;font-size:10.5px;color:var(--fg3);
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:9px;padding:5px 10px;z-index:5;
}

/* ── 属性 / 规则面板 ────────────────────────────────────── */
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;margin-bottom:10px}
.seg button{
  padding:3px 9px;border-radius:7px;border:0;background:transparent;color:var(--fg3);
  cursor:pointer;font-size:11px;transition:all var(--t);
}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent-soft);color:var(--accent-hover);box-shadow:inset 0 0 0 1px rgba(74,163,255,.28)}
.ptabs{display:flex;gap:1px;border-bottom:1px solid var(--divider);padding:0 12px;flex:none;background:var(--bg-elevated)}
.ptab{
  padding:9px 11px;border:0;background:transparent;color:var(--fg3);cursor:pointer;font-size:12px;
  border-bottom:2px solid transparent;transition:all var(--t);
}
.ptab:hover{color:var(--fg2)}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ptab .n{font-family:var(--mono);font-size:10px;color:var(--fg3);margin-left:4px}
table.t{width:100%;border-collapse:collapse}
table.t th{
  text-align:left;font-size:10.5px;font-weight:600;color:var(--fg3);padding:6px 7px;
  border-bottom:1px solid var(--divider);letter-spacing:.4px;
}
table.t td{padding:5px 7px;border-bottom:1px solid var(--divider);font-size:11.5px;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:var(--bg-hover)}
table.t select{
  width:100%;padding:2px 5px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--fg);font-size:11px;outline:none;cursor:pointer;
}
table.t select:focus{border-color:var(--accent)}
table.t input{
  width:100%;padding:2px 5px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--fg);font-size:11.5px;outline:none;
}
table.t input:hover{border-color:var(--border)}
table.t input:focus{border-color:var(--accent);background:var(--bg-input)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:11.5px;border-bottom:1px dashed var(--divider)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--fg3);white-space:nowrap}
.kv .v{color:var(--fg);text-align:right;font-family:var(--mono);font-size:11px;word-break:break-all}
.acc{border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;overflow:hidden;background:var(--bg-surface)}
.acc .ah{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer;transition:all var(--t)}
.acc .ah:hover{background:var(--bg-hover)}
.acc .ah .ar{font-size:9px;color:var(--fg3);transition:transform var(--t)}
.acc.open .ah .ar{transform:rotate(90deg)}
.acc .ah b{font-size:11.5px;font-weight:500}
.acc .ab{display:none;padding:2px 9px 9px;border-top:1px solid var(--divider)}
.acc.open .ab{display:block}
.crow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--divider);font-size:11px}
.crow:last-child{border-bottom:0}
.crow .nm{flex:1;color:var(--fg2)}
.pill{
  padding:1px 7px;border-radius:6px;font-size:10px;border:1px solid var(--border);
  color:var(--fg3);background:var(--bg-subtle);white-space:nowrap;
}
.pill.err{color:var(--err);border-color:rgba(255,123,114,.3);background:var(--err-soft)}
.pill.warn{color:var(--warn);border-color:rgba(242,182,109,.3);background:var(--warn-soft)}
.pill.ok{color:var(--ok);border-color:rgba(76,195,138,.3);background:var(--ok-soft)}
.field{margin-bottom:9px}
.field label{display:block;font-size:10.5px;color:var(--fg3);margin-bottom:4px;letter-spacing:.4px}
.field select,.field input,.field textarea{
  width:100%;padding:6px 9px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--fg);outline:none;font-size:11.5px;
}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.addbtn{
  width:100%;padding:6px;border-radius:9px;border:1px dashed var(--border-strong);
  background:transparent;color:var(--fg3);cursor:pointer;font-size:11px;transition:all var(--t);
}
.addbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ── 验证 / AI 面板 ─────────────────────────────────────── */
.msg{
  border-radius:var(--r-sm);padding:9px 11px;font-size:11.5px;line-height:1.65;
  background:var(--bg-subtle);border:1px solid var(--border);color:var(--fg2);margin-bottom:9px;
}
.msg.ai{
  background:linear-gradient(135deg,rgba(74,163,255,.10),rgba(74,163,255,.04));
  border-color:rgba(74,163,255,.26);color:var(--fg);
}
.msg b{color:var(--accent-hover);font-weight:600}
.msg .k{
  display:inline-block;padding:0 5px;border-radius:5px;background:rgba(140,192,255,.1);
  color:var(--fg);font-family:var(--mono);font-size:10.5px;
}
.plan{
  background:#050d18;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;
  font-family:var(--mono);font-size:10.5px;line-height:1.65;color:#9fd0ff;overflow:auto;
  white-space:pre;margin-bottom:9px;
}
.plan .kw{color:#7fd0ff}.plan .st{color:#4cc38a}.plan .tb{color:#f2b66d}.plan .cm{color:#5a7a9a}
.cov{display:flex;gap:8px;margin-bottom:9px}
.covbox{flex:1;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px;background:var(--bg-surface)}
.covbox .k{font-size:10px;color:var(--fg3)}
.covbox .v{font-size:17px;font-weight:600;font-family:var(--mono)}
.bar{height:4px;border-radius:4px;background:var(--bg-input);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--ok))}
.bar.warn i{background:linear-gradient(90deg,var(--amber),var(--err))}
.impact{border-left:2px solid var(--border);padding-left:9px;margin-bottom:9px}
.impact .ih{font-size:10.5px;color:var(--fg3);letter-spacing:.5px;margin-bottom:3px}
.impact .it{font-size:11.5px;color:var(--fg2);padding:2px 0}
.impact .it code{color:var(--fg);background:var(--bg-input);padding:0 4px;border-radius:4px;font-size:10.5px}
.cmdchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.cmdchip{
  padding:3px 9px;border-radius:999px;border:1px solid var(--border);background:var(--bg-subtle);
  color:var(--fg2);font-size:10.5px;cursor:pointer;transition:all var(--t);
}
.cmdchip:hover{border-color:var(--accent);color:var(--accent)}
.chatbox{display:flex;gap:6px;margin-top:auto;padding-top:9px;border-top:1px solid var(--divider)}
.chatbox .inp{flex:1}

/* ── 其它视图（Skill / MCP / 调度 / 版本） ──────────────── */
.view{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg-surface)}
.stat .k{font-size:10.5px;color:var(--fg3);display:flex;align-items:center;gap:5px}
.stat .v{font-size:22px;font-weight:600;font-family:var(--mono);margin:2px 0}
.stat .x{font-size:10.5px;color:var(--fg3)}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.skcard{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:var(--bg-surface);transition:all var(--t)}
.skcard:hover{border-color:var(--border-strong);box-shadow:var(--sh-sm)}
.skcard .sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.skcard .sh b{font-size:13px;font-weight:600;flex:1}
.skcard .sd{font-size:11.5px;color:var(--fg2);margin-bottom:8px}
.skcard .sf{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.skmode{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.skmode button{padding:2px 9px;border:0;background:transparent;color:var(--fg3);font-size:10.5px;cursor:pointer}
.skmode button.on{background:var(--accent-soft);color:var(--accent-hover)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ── toast ──────────────────────────────────────────────── */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{
  padding:9px 14px;border-radius:var(--r-sm);font-size:12px;
  background:var(--bg-elevated);border:1px solid var(--border-strong);color:var(--fg);
  box-shadow:var(--sh);animation:tin .28s cubic-bezier(.2,.9,.3,1);max-width:420px;
}
.toast.ok{border-color:rgba(76,195,138,.4)}
.toast.warn{border-color:rgba(242,182,109,.4)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ══════════════ 顶栏 ══════════════ -->
<div class="top">
  <div class="brand"><span class="dot"></span>MinWorkBuddy <small>· 本体建模工作台</small></div>
  <div class="crumb">本体 / 零售金融 / <b>汽车零部件供应链（v3 candidate）</b></div>
  <div class="vtabs" id="vtabs">
    <button class="vtab on" data-v="model">建模画布</button>
    <button class="vtab" data-v="skill">Skill<span class="n">3</span></button>
    <button class="vtab" data-v="mcp">MCP 服务</button>
    <button class="vtab" data-v="sched">调度</button>
    <button class="vtab" data-v="ver">版本</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="toast('已保存草稿 · draft v3（未发布）','ok')">保存</button>
  <button class="btn warn" onclick="toast('演示开发策略：沙箱运行 1 次（未写入正式版本）','warn')">演示开发策略</button>
  <button class="btn pri" onclick="publish()">发布</button>
</div>

<!-- ══════════════ 主体 ══════════════ -->
<div class="main" id="mainGrid">

const KIND = {

  relation:{fill:'rgba(180,142,240,.14)', stroke:'#b48ef0', text:'#eadcff', w:140, h:40},
  ontology:{fill:'rgba(123,139,164,.14)', stroke:'#7b8ba4', text:'#dde5f0', w:150, h:46}
};

let sel = 'c1', ptab = 'info', wtab = 'ai', view = 'model';
let zoomK = 1, panX = 0, panY = 0, drag = null;
const activeTags = new Set();

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function toast(msg, kind){
  const d = document.createElement('div');
  d.className = 'toast ' + (kind||'');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),320); }, 3400);
}
function node(id){ return NODES.find(n=>n.id===id); }

/* ═══════════ 资产视图 ═══════════ */
function renderTree(){
  $('#tree').innerHTML = SOURCES.map((s,i)=>`
    <div class="tnode ${s.open?'open':''}" onclick="toggleSrc(${i})">
      <span class="ar">▶</span><span>${s.n}</span><span class="cnt">${s.c}</span>
    </div>
    ${s.open && s.kids ? s.kids.map(k=>`
      <div class="tnode ${k.on?'on':''}" style="padding-left:24px" onclick="filterDb('${k.n}',this)">
        <span style="width:6px;height:6px;border-radius:2px;background:${k.on?'var(--accent)':'var(--fg3)'}"></span>
        <span>${k.n}</span><span class="cnt">${k.c}</span>
      </div>`).join('') : ''}
  `).join('');
}
function toggleSrc(i){ SOURCES[i].open = !SOURCES[i].open; renderTree(); }
function filterDb(name, el){
  $$('.tnode').forEach(n=>n.classList.remove('on'));
  el.classList.add('on');
  toast('按数据源过滤：'+name);
}
function renderChips(){
  $('#tagChips').innerHTML = TAGS.map(t=>
    `<span class="chip ${activeTags.has(t)?'on':''}" onclick="togTag('${t}')">${t}</span>`).join('')
    + `<span class="chip add" onclick="toast('新增标签（demo）')">＋ 新增标签</span>`;
}
function togTag(t){ activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); renderChips(); renderAssets(); }
function renderAssets(){
  const q = ($('#assetSearch').value||'').toLowerCase();
  const list = ASSETS.filter(a=>{
    const okq = !q || a.n.toLowerCase().includes(q) || a.ddl.toLowerCase().includes(q);
    const okt = !activeTags.size || [...activeTags].every(t=>a.tags.includes(t));
    return okq && okt;
  });
  $('#assetCnt').textContent = list.length + ' / ' + ASSETS.length;
  $('#assetList').innerHTML = list.map(a=>`
    <div class="acard" draggable="true" ondragstart="dragAsset(event,'${a.n}')">
      <div class="ah">
        <span style="width:8px;height:8px;border-radius:2px;background:var(--accent)"></span>
        <b>${a.n}</b>
        <div style="flex:1"></div>
        ${a.unmapped?'<span class="tag a">未映射</span>':''}
        <span class="pill ${a.st==='pass'?'ok':a.st==='warn'?'warn':'err'}">${a.st==='pass'?'校验通过':a.st==='warn'?'校验告警':'校验失败'}</span>
      </div>
      <div class="ddl">${a.ddl.replace(/</g,'&lt;')}</div>
      <div class="af">
        <button class="mini" onclick="event.stopPropagation();toast('连接测试：${a.n} → OK (38ms)')">测试</button>
        <button class="mini" onclick="event.stopPropagation();toast('抽样预览：${a.n} → 5 行')">预览</button>
        <button class="mini ${a.st==='pass'?'ok':''}" onclick="event.stopPropagation();toast('质量校验：${a.n} → ${a.st}')">校验</button>
        <div style="flex:1"></div>
        <span class="mono" style="font-size:10px;color:var(--fg3)">crm.sales</span>
      </div>
    </div>`).join('') || '<div style="color:var(--fg3);font-size:11.5px;padding:10px 0">无匹配资产</div>';
}
function filterAssets(){ renderAssets(); }

/* ═══════════ 画布 ═══════════ */
const VW = 880, VH = 520;
function renderCanvas(){
  const svg = $('#canvas');
  let g = `<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(140,192,255,.42)"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(74,163,255,.85)"/></marker>
  </defs><g transform="translate(${panX},${panY}) scale(${zoomK})">`;

  EDGES.forEach(e=>{
    const a = node(e.f), b = node(e.t); if(!a||!b) return;
    const A = KIND[a.kind], B = KIND[b.kind];
    const ax = a.x + A.w, ay = a.y + A.h/2, bx = b.x, by = b.y + B.h/2;
    const mx = (ax+bx)/2, my = (ay+by)/2;
    const hl = (e.f===sel || e.t===sel);
    g += `<path d="M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}" fill="none"
        stroke="${hl?'rgba(74,163,255,.85)':'rgba(140,192,255,.22)'}" stroke-width="${hl?1.8:1.2}"
        marker-end="url(#${hl?'arh':'ar'})"/>`;
    const short = {maps_to:'map', has_property:'prop', from:'from', to:'to', belongs:'belongs'}[e.l] || e.l;
    const w = short.length * 5.4 + 10;
    g += `<g><title>${e.l}</title>
      <rect x="${mx-w/2}" y="${my-19}" width="${w}" height="13" rx="3.5"
        fill="rgba(7,17,31,.9)" stroke="${hl?'rgba(74,163,255,.35)':'rgba(140,192,255,.16)'}"/>
      <text class="e-label" x="${mx}" y="${my-9}" text-anchor="middle"
        fill="${hl?'#7fd0ff':'#6d87a5'}">${short}</text></g>`;
  });
  NODES.forEach(n=>{
    const K = KIND[n.kind], s = n.id===sel;
    g += `<g class="n-box ${s?'sel':''}" data-id="${n.id}" transform="translate(${n.x},${n.y})" onmousedown="dragNode(event,'${n.id}')" onclick="pick('${n.id}')">
      <rect width="${K.w}" height="${K.h}" rx="10" fill="${K.fill}" stroke="${s?'var(--accent)':K.stroke}" stroke-width="${s?2:1.2}"/>
      <rect x="0" y="0" width="3.5" height="${K.h}" rx="2" fill="${K.stroke}" opacity=".9"/>
      <text class="n-label" x="12" y="${n.kind==='concept'?18:16}" fill="${K.text}">${n.label}</text>
      <text class="n-sub"  x="12" y="${n.kind==='concept'?33:29}" fill="#8fa8c6">${n.sub}</text>
    </g>`;
  });
  svg.innerHTML = g + '</g>';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
}
function toSvg(ev){
  const svg = $('#canvas'), r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  return { x:(ev.clientX-r.left)*(vb.width/r.width), y:(ev.clientY-r.top)*(vb.height/r.height) };
}
function dragNode(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const n = node(id), p = toSvg(ev);
  drag = {id, dx:p.x-n.x, dy:p.y-n.y};
  $('#canvas').addEventListener('mousemove', onMove);
  $('#canvas').addEventListener('mouseup', onUp);
}
function onMove(ev){
  if(!drag) return;
  const p = toSvg(ev), n = node(drag.id);
  n.x = Math.max(0, Math.min(VW-180, p.x-drag.dx));
  n.y = Math.max(0, Math.min(VH-50,  p.y-drag.dy));
  renderCanvas();
}
function onUp(){
  $('#canvas').removeEventListener('mousemove', onMove);
  $('#canvas').removeEventListener('mouseup', onUp);
  drag = null;
}
function pick(id){ sel = id; renderCanvas(); renderPanel(); renderWork(); }
function zoom(d){ zoomK = Math.max(.6, Math.min(1.6, zoomK + d*.12)); renderCanvas(); }
function fitView(){ zoomK = 1; panX = 0; panY = 0; renderCanvas(); }
function dragAsset(ev, name){ ev.dataTransfer.setData('text/plain', name); ev.dataTransfer.effectAllowed='copy'; }
function autoMap(){
  const t = NODES.find(n=>n.kind==='table' && !EDGES.some(e=>e.f===n.id && e.l==='maps_to'));
  if(!t){ toast('所有物理表均已建立 maps_to 映射','ok'); return; }
  const a = ASSETS.find(x=>x.n===t.label); if(a){ a.unmapped=false; renderAssets(); }
  EDGES.push({f:t.id, t:'s1', l:'maps_to'});
  renderCanvas();
  toast('已为 '+t.label+' 提议 maps_to → supplier_id（规则通道 confidence 0.81）','ok');
}
$('#canvasWrap').addEventListener('dragover', e=>{ e.preventDefault(); $('#canvasWrap').classList.add('drop'); });
$('#canvasWrap').addEventListener('dragleave', ()=>$('#canvasWrap').classList.remove('drop'));
$('#canvasWrap').addEventListener('drop', e=>{
  e.preventDefault(); $('#canvasWrap').classList.remove('drop');
  const name = e.dataTransfer.getData('text/plain'); if(!name) return;
  const p = toSvg(e);
  NODES.push({id:'t'+Date.now().toString(36), kind:'table',
    x:Math.max(0,p.x-80), y:Math.max(0,p.y-20), label:name, sub:'新拖入资产 · 待映射'});
  renderCanvas();
  toast('已拖入资产「'+name+'」→ 拖到概念节点上完成 maps_to','ok');
});

  }
  else if(ptab==='info'){
    h = `<div class="sub">节点类型</div>
      <div class="seg">
        ${['属性','类型','合段','行动','派生','安全'].map((k,i)=>

  else {
    h = `<div class="sub">派生规则</div>
      <div class="field"><label>选择分组</label><select><option>请选择</option><option>零售金融 › 供应链</option><option>零售金融 › 风险管控</option></select></div>

        <span style="color:var(--fg3)">executable = false（执行器留 P4），建模期仅登记</span>
      </div>`;

  $('#panel').innerHTML = h;
}
function updProp(i,k,v){ node(sel).props[i][k] = v; toast('属性已更新：'+node(sel).label+'.'+node(sel).props[i].p+' = '+v); renderCanvas(); }

$('#vtabs').addEventListener('click', e=>{
  const b = e.target.closest('.vtab'); if(!b) return;
  $$('#vtabs .vtab').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  view = b.dataset.v;
  if(view==='model'){ $('#mainGrid').style.display='grid'; $('#views').style.display='none'; }
  else { $('#mainGrid').style.display='none'; renderViews(); }
});
$('#ptabs').addEventListener('click', e=>{
  const b = e.target.closest('.ptab'); if(!b) return;
  $$('#ptabs .ptab').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  ptab = b.dataset.p; renderPanel();
});
$('#vtabs2').addEventListener('click', e=>{
  const b = e.target.closest('.ptab'); if(!b) return;
  $$('#vtabs2 .ptab').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  wtab = b.dataset.w; renderWork();
});
